<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="">
  <!--
    An art-directed placeholder standing in for the school's own photograph of its
    building. Late-afternoon light on pale stone: the facade is the brightest thing in
    the frame, so it still reads as the subject once a scrim is laid over the base.
  -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93A7B4"/>
      <stop offset="0.52" stop-color="#C3CDD0"/>
      <stop offset="1" stop-color="#E4DFD2"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#F6E9C8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F6E9C8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2EADA"/>
      <stop offset="1" stop-color="#DACEB8"/>
    </linearGradient>
    <linearGradient id="stoneShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2D7C2"/>
      <stop offset="1" stop-color="#C6B99F"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C4A44"/>
      <stop offset="1" stop-color="#6E6A5F"/>
    </linearGradient>
    <linearGradient id="glassPane" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#6E7C82"/>
      <stop offset="1" stop-color="#3E474C"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C8770"/>
      <stop offset="1" stop-color="#59634F"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant tree line, kept low-contrast so it sits behind the facade -->
  <g fill="#8E9A8B" opacity="0.55">
    <circle cx="90" cy="520" r="86"/><circle cx="170" cy="548" r="64"/>
    <circle cx="1500" cy="512" r="92"/><circle cx="1418" cy="546" r="62"/>
  </g>

  <!-- main block -->
  <rect x="150" y="300" width="1300" height="352" fill="url(#stone)"/>
  <rect x="150" y="300" width="1300" height="14" fill="#F7F1E4"/>

  <!-- cornice and entablature -->
  <rect x="120" y="268" width="1360" height="36" fill="url(#stoneShade)"/>
  <rect x="136" y="252" width="1328" height="18" fill="#F4EDDD"/>

  <!-- pediment over the entrance -->
  <path d="M640 252 800 150 960 252z" fill="url(#stoneShade)"/>
  <path d="M640 252 800 150 960 252z" fill="none" stroke="#F4EDDD" stroke-width="10"/>
  <circle cx="800" cy="216" r="26" fill="#EFE6D2" stroke="#B9AB90" stroke-width="5"/>
  <path d="M800 198v18l12 8" fill="none" stroke="#8C7F66" stroke-width="5" stroke-linecap="round"/>

  <!-- colonnade: base, shaft, capital -->
  <g>
    <g fill="url(#recess)">
      <rect x="600" y="330" width="400" height="290"/>
    </g>
    <g fill="url(#stone)">
      <rect x="612" y="318" width="44" height="302"/>
      <rect x="700" y="318" width="44" height="302"/>
      <rect x="788" y="318" width="44" height="302"/>
      <rect x="876" y="318" width="44" height="302"/>
      <rect x="956" y="318" width="44" height="302"/>
    </g>
    <g fill="#F7F1E4">
      <rect x="604" y="310" width="60" height="14"/><rect x="692" y="310" width="60" height="14"/>
      <rect x="780" y="310" width="60" height="14"/><rect x="868" y="310" width="60" height="14"/>
      <rect x="948" y="310" width="60" height="14"/>
    </g>
    <g fill="#CDBFA5">
      <rect x="604" y="612" width="60" height="16"/><rect x="692" y="612" width="60" height="16"/>
      <rect x="780" y="612" width="60" height="16"/><rect x="868" y="612" width="60" height="16"/>
      <rect x="948" y="612" width="60" height="16"/>
    </g>
  </g>

  <!-- window bays on both wings -->
  <g>
    <g fill="url(#glassPane)">
      <rect x="208" y="360" width="62" height="96" rx="3"/><rect x="310" y="360" width="62" height="96" rx="3"/>
      <rect x="412" y="360" width="62" height="96" rx="3"/><rect x="514" y="360" width="62" height="96" rx="3"/>
      <rect x="1030" y="360" width="62" height="96" rx="3"/><rect x="1132" y="360" width="62" height="96" rx="3"/>
      <rect x="1234" y="360" width="62" height="96" rx="3"/><rect x="1336" y="360" width="62" height="96" rx="3"/>
      <rect x="208" y="502" width="62" height="96" rx="3"/><rect x="310" y="502" width="62" height="96" rx="3"/>
      <rect x="412" y="502" width="62" height="96" rx="3"/><rect x="514" y="502" width="62" height="96" rx="3"/>
      <rect x="1030" y="502" width="62" height="96" rx="3"/><rect x="1132" y="502" width="62" height="96" rx="3"/>
      <rect x="1234" y="502" width="62" height="96" rx="3"/><rect x="1336" y="502" width="62" height="96" rx="3"/>
    </g>
    <g fill="#F7F1E4">
      <rect x="200" y="348" width="78" height="12"/><rect x="302" y="348" width="78" height="12"/>
      <rect x="404" y="348" width="78" height="12"/><rect x="506" y="348" width="78" height="12"/>
      <rect x="1022" y="348" width="78" height="12"/><rect x="1124" y="348" width="78" height="12"/>
      <rect x="1226" y="348" width="78" height="12"/><rect x="1328" y="348" width="78" height="12"/>
      <rect x="200" y="490" width="78" height="12"/><rect x="302" y="490" width="78" height="12"/>
      <rect x="404" y="490" width="78" height="12"/><rect x="506" y="490" width="78" height="12"/>
      <rect x="1022" y="490" width="78" height="12"/><rect x="1124" y="490" width="78" height="12"/>
      <rect x="1226" y="490" width="78" height="12"/><rect x="1328" y="490" width="78" height="12"/>
    </g>
  </g>

  <!-- doorway under the colonnade -->
  <path d="M762 470h76a38 38 0 0 1 0 0v150h-76z" fill="#3B3F3C"/>
  <rect x="762" y="470" width="76" height="150" fill="#3B3F3C"/>
  <rect x="798" y="470" width="4" height="150" fill="#6E6A5F"/>

  <!-- steps -->
  <g fill="url(#stoneShade)">
    <rect x="560" y="620" width="480" height="16"/>
    <rect x="536" y="636" width="528" height="16"/>
    <rect x="512" y="652" width="576" height="16"/>
  </g>

  <!-- forecourt -->
  <rect y="668" width="1600" height="232" fill="url(#lawn)"/>
  <rect y="668" width="1600" height="10" fill="#8E9880" opacity="0.7"/>
  <path d="M700 668h200l70 232H630z" fill="#B9B3A0" opacity="0.55"/>

  <!-- framing trees, foreground -->
  <g fill="#414C3A" opacity="0.85">
    <rect x="86" y="560" width="14" height="140"/>
    <circle cx="93" cy="530" r="76"/><circle cx="38" cy="566" r="52"/><circle cx="150" cy="566" r="50"/>
    <rect x="1504" y="556" width="14" height="150"/>
    <circle cx="1511" cy="524" r="80"/><circle cx="1566" cy="562" r="54"/><circle cx="1452" cy="562" r="52"/>
  </g>
</svg>
