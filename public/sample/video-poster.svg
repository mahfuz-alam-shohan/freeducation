    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#dusk)"/>
  <circle cx="470" cy="96" r="120" fill="#38493F" opacity="0.55"/>
  <path d="M0 268h640v92H0z" fill="#1B241F"/>
  <path d="M96 268l84-74 66 46 78-86 96 114z" fill="#2E3D34"/>
  <path d="M292 268l112-96 144 96z" fill="#374739" opacity="0.8"/>
