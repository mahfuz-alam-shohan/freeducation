<div class="notification-dropdown hidden" data-notification-panel>
    <div class="notification-header">
        <h3 class="font-semibold">Notifications</h3>
        <button class="btn btn-ghost btn-sm" data-mark-all-read>
            Mark all as read
        </button>
    </div>
    <div class="notification-list" data-notification-list>
        <!-- Notifications will be inserted here -->
    </div>
    <div class="notification-footer">
        <button class="btn btn-ghost btn-sm w-full">View all notifications</button>
    </div>
</div>

<div class="mobile-notification-panel hidden" data-mobile-notification-panel>
    <div class="panel-header">
        <h3 class="font-semibold">Notifications</h3>
        <button class="btn btn-ghost btn-sm" data-close-mobile-notifications>
            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>
    <div class="panel-content">
        <div class="notification-list" data-mobile-notification-list>
            <!-- Mobile notifications will be inserted here -->
        </div>
    </div>
</div>
