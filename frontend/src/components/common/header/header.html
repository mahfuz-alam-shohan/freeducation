<header class="app-header" data-header>
    <div class="header-container">
        <!-- Left Section: Menu Toggle & Logo -->
        <div class="header-left">
            <!-- Menu Toggle Button -->
            <button 
                class="btn btn-ghost desktop-hidden" 
                data-menu-toggle
                aria-label="Toggle menu"
            >
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            
            <!-- Sidebar Toggle (Desktop) -->
            <button 
                class="btn btn-ghost mobile-hidden" 
                data-sidebar-toggle
                aria-label="Toggle sidebar"
            >
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
            
            <!-- Logo and Site Name -->
            <div class="logo-section">
                <div class="logo">
                    <svg class="icon-lg" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5z"/>
                    </svg>
                </div>
                <div class="site-name">
                    <h1 class="site-title">Freeducation</h1>
                </div>
            </div>
        </div>
        
        <!-- Right Section: Notifications & Profile -->
        <div class="header-right">
            <!-- Notifications -->
            <div class="notification-section" data-notification-section>
                <button 
                    class="btn btn-ghost relative" 
                    data-notification-toggle
                    aria-label="Notifications"
                >
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
                    </svg>
                    <span class="notification-badge hidden" data-notification-count>0</span>
                </button>
            </div>
            
            <!-- Profile -->
            <div class="profile-section" data-profile-section>
                <button 
                    class="btn btn-ghost profile-btn" 
                    data-profile-toggle
                    aria-label="Profile menu"
                >
                    <!-- Profile Avatar (when logged in) -->
                    <div class="profile-avatar hidden" data-user-avatar>
                        <img src="" alt="Profile" class="avatar-img">
                    </div>
                    
                    <!-- Profile Icon (when logged out) -->
                    <div class="profile-icon" data-default-avatar>
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                        </svg>
                    </div>
                </button>
            </div>
        </div>
    </div>
</header>
