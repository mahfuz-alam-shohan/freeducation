name = "freeducation"
main = "src/index.ts"
compatibility_date = "2024-10-01"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "freeducation"
database_id = "ffb6494a-52e3-487a-b259-c396438ac565"


# R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "freeducation"

# Vars for security (You should set these in Cloudflare Dashboard too)
[vars]
JWT_SECRET = "change-this-secret-to-something-long-and-random"
