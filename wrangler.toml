name = "freeducation"
main = "src/index.ts"
compatibility_date = "2025-12-29"

# D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "freeducation"
database_id = "1a6af1c4-6813-4716-b620-d059df596899"


# R2 Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "freeducation"

# Vars for security (You should set these in Cloudflare Dashboard too)
[vars]
JWT_SECRET = "change-this-secret-to-something-long-and-random"
